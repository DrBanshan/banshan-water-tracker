# The community directory's own validation, run on every pull request, using the shared workflow from
# obsidianmd/obsidian-workflows. The same rigour the community submission will meet, enforced by the
# directory's own tooling rather than an approximation of it. The release half of that repository's
# catalogue is already answered by release.yml, so this covers pr mode only, which is the only mode that
# can serve as a check at all. release mode also attests its build, files a submission and opens a draft
# release, which is not what a review should do, and it stops with a cannot-create-release error whenever
# the ref being reviewed is not a tag.
#
# What is and is not enforced here was measured rather than assumed, on throwaway branches, each with
# one violation in it:
#   a manifest.json with no name       red     the schema checks are real
#   an !important in the stylesheet    green   not caught
#   an innerHTML assignment in main.ts green   not caught
# So this workflow is the directory's schema gate, and it is worth having for that. It is not a lint:
# the lint and scanner-lint inputs are set because that is what the shared workflow's users set, but in
# pr mode they demonstrably did not look at our bundle or our stylesheet, so the findings the community
# reviewer itself raised by name, !important and innerHTML among them, are caught here instead by the
# repository's own suite, in tests/render.test.ts, which is the place that has been shown to bite.
# Nothing is built in this workflow either, because building the assets changed none of the three
# results above and a step that cannot change an outcome is not worth running on every pull request.
name: Obsidian plugin review

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review:
    name: Validate as the directory would
    runs-on: ubuntu-latest
    steps:
      - name: Check out the commit
        uses: actions/checkout@v4

      - name: Review the plugin
        uses: obsidianmd/obsidian-workflows@v1
        with:
          type: plugin
          mode: pr
          scanner-lint: true
          strict: true
          lint: true
