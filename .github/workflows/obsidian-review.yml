name: Obsidian plugin review

# The community directory's own validation and scanner rulesets, enforced strictly, using the
# official obsidianmd/obsidian-workflows action. The release half (building the assets, attesting
# them, publishing the draft release) is already covered by release.yml, so this runs the checking
# half only: the manifest schema, readme and licence presence, the build, and the scanner's
# stylelint and eslint rulesets.
#
# The mode stays at pr rather than release on purpose. Release mode also attests the artifacts and
# opens a draft release, and it stops with a cannot-create-release error unless it runs from a tag
# ref, so it could not serve as a pull request check at all. scanner-lint is the switch release mode
# forces on to obtain the directory's rulesets, and strict is what turns policy findings from
# warnings into failures, so the pair gives the same rigour without the publishing.
#
# The build is a step of its own rather than the action's build input, because that input's own
# documentation limits build discovery to plugins in release mode, and a review whose scanner is handed
# an empty shelf still goes green. What makes that worth writing down is that it was measured rather than
# assumed: a branch carrying an !important in the stylesheet, the very finding the community reviewer
# raised by name, came back green, while a branch with a manifest missing its name came back red. So the
# validating half of the action has teeth and the linting half had nothing to bite.
#
# The install step is there because the build above needs esbuild on disk. The action installs
# dependencies as part of its own run and an extra install only costs seconds, whereas a missing
# install costs a red run whose cause is anywhere but obvious, so the certain thing wins over the
# tidier one.
#
# There is deliberately no push trigger. Pushing main to cut a release used to drag a review run along
# with it, and a release asked for on its own should not summon a check nobody asked for. The review
# therefore runs on pull requests and when started by hand from the Actions tab, so asking for a
# release cannot cause this one.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review:
    name: Validate and lint as the directory would
    runs-on: ubuntu-latest
    steps:
      - name: Check out the commit
        uses: actions/checkout@v4

      - name: Install
        run: npm ci

      # Built here rather than left to the action, because the linters have nothing otherwise to read.
      # main.js and styles.css are gitignored and so are not in a checkout, and the action's own text
      # limits build auto-detection to plugins in release mode, which leaves the scanning half of this
      # workflow looking at an empty shelf. It is npm run release and not npm run build because the
      # latter deploys into the development vault, a path a runner does not have, and leaves nothing at
      # the repository root, while release mode writes exactly the three files the scanner wants and
      # never goes near a vault.
      - name: Build the assets the scanner reads
        run: npm run release

      - name: Review the plugin
        uses: obsidianmd/obsidian-workflows@v1
        with:
          type: plugin
          mode: pr
          scanner-lint: true
          strict: true
          lint: true
